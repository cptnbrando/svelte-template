name: Deploy Cloudflare environments

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.event_name == 'push' && github.ref_name == 'master' && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PROJECT_NAME: __APP_CFNAME__
  DEPLOY_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ github.ref_name == 'master' && github.event_name == 'push' && 'Production' || 'Staging preview' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Build
        run: npm run build
      - name: Apply staging D1 migrations
        if: github.event_name == 'pull_request' || github.ref_name != 'master'
        run: npx --yes wrangler d1 migrations apply "$PROJECT_NAME-staging" --remote --env preview --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply production D1 migrations
        if: github.event_name == 'push' && github.ref_name == 'master'
        run: npx --yes wrangler d1 migrations apply "$PROJECT_NAME-production" --remote --env production --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Pages
        run: npx --yes wrangler pages deploy dist --project-name "$PROJECT_NAME" --branch "$DEPLOY_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
